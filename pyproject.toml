[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bc250-smu-unlock"
version = "0.1.0"
description = "BC-250 SMU unlock + SRAM patcher (q2 msg 0x23 append-ring exploit)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rw-r-r-0644" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Hardware",
]

[project.scripts]
bc250-smu-unlock = "unlock:main"
bc250-smu-patcher = "patcher:main"
bc250-smu-set-core-mask = "set_core_mask:main"
bc250-smu-rpc-demo = "rpc_demo:main"

[tool.setuptools]
packages = ["bc250_smu"]
py-modules = [
  "unlock",
  "patcher",
  "set_core_mask",
  "rpc_demo",
]

[tool.setuptools.package-data]
bc250_smu = ["patches.hex"]
